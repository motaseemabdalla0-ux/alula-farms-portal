    <meta name="description" content="AlUla Expropriated Farms — maps, wells, power meters and date production" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="shell">
      <!-- Icon rail, same pattern as the Agriculture Center platform (72px, white, active item gray-100) -->
      <aside class="rail" id="rail" hidden>
        <nav id="nav">
          <a href="#/" data-ico="dashboard" title="لوحة المؤشرات" aria-label="لوحة المؤشرات"></a>
          <a href="#/map" data-ico="map" title="الخريطة" aria-label="الخريطة"></a>
          <a href="#/farms" data-ico="sprout" title="المزارع" aria-label="المزارع"></a>
          <a href="#/wells" data-ico="droplet" title="الآبار" aria-label="الآبار"></a>
          <a href="#/meters" data-ico="meter" title="العدادات" aria-label="العدادات"></a>
          <a href="#/review" data-ico="alert" title="مراجعة البيانات" aria-label="مراجعة البيانات"></a>
        </nav>
        <button type="button" id="logout" data-ico="logout" title="تسجيل الخروج" aria-label="تسجيل الخروج"></button>
      </aside>
      <div class="main-col">
        <header class="topbar">
          <div class="tb-start">
            <span class="tb-ico" data-ico="sprout"></span>
            <div class="tb-title">
              <h2 id="tb-page">AlUla Expropriated Farms</h2>
              <p><span id="tb-sub">AlUla Expropriated Farms</span><span class="tb-date" id="tb-date"></span></p>
            </div>
          </div>
          <div class="tb-end">
          <div class="tb-tools" id="tb-end" hidden>
            <form id="gsearch" class="tb-search"><span data-ico="search"></span><input name="q" placeholder="ابحث برمز المزرعة…" aria-label="بحث" /></form>
            <div class="tb-updated"><small id="tb-upd-l">آخر تحديث</small><b id="tb-updated"></b></div>
            <button type="button" class="icon-btn" id="print" data-ico="printer" title="طباعة" aria-label="طباعة"></button>
          </div>
            <button type="button" class="lang-btn" id="lang" aria-label="English">EN</button>
          </div>
        </header>
        <nav class="mnav" id="mnav" hidden></nav>
        <main id="app"><p class="muted">جارٍ التحميل…</p></main>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="app.js"></script>
